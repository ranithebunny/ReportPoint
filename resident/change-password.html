
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password · ReportPoint</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="../admin/css/admin.css">
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="ReportPoint">
        <img class="brand-mark" src="../assets/logo-placeholder.png" alt="College Point">
        <span class="brand-divider"></span>
        <span class="brand-name">
          ReportPoint<span class="admin-badge">RESIDENT</span>
        </span>
      </a>
    </div>
  </header>

  <main id="main">
    <div class="login-wrap">
      <p class="eyebrow">Account security</p>
      <h1>Change your password</h1>
      <p class="muted" style="margin:.75rem 0 1.5rem">
        Before continuing, please create a new password for your account.
      </p>

      <div class="card">
        <form id="change-password-form" novalidate>
          <div id="password-alert" class="alert-box danger" role="alert" hidden></div>

          <div class="field">
            <label for="new-password">
              New password <span class="req" aria-hidden="true">*</span>
            </label>
            <input
              type="password"
              id="new-password"
              name="new_password"
              autocomplete="new-password"
              required
            >
            <div class="error-text" id="new-password-error"></div>
          </div>

          <div class="field">
            <label for="confirm-password">
              Confirm new password <span class="req" aria-hidden="true">*</span>
            </label>
            <input
              type="password"
              id="confirm-password"
              name="confirm_password"
              autocomplete="new-password"
              required
            >
            <div class="error-text" id="confirm-password-error"></div>
          </div>

          <p class="hint" style="margin-bottom:1.25rem">
            Your password must be at least 12 characters long.
          </p>

          <button class="btn btn-primary btn-block" type="submit">
            Update password
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    © 2026 ReportPoint · Group SoHo · College Point Manila
  </footer>

  <script src="../admin/js/ui.js"></script>

  <script>
    const form = document.getElementById('change-password-form');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = form.elements['new_password'];
      const confirmPassword = form.elements['confirm_password'];
      const alertBox = document.getElementById('password-alert');

      alertBox.hidden = true;

      UI.showFieldError(
        newPassword,
        newPassword.value.length >= 12
          ? ''
          : 'Password must be at least 12 characters long.'
      );

      UI.showFieldError(
        confirmPassword,
        confirmPassword.value
          ? ''
          : 'Please confirm your new password.'
      );

      if (newPassword.value.length < 12 || !confirmPassword.value) {
        return;
      }

      if (newPassword.value.length > 72) {
        UI.showFieldError(
          newPassword,
          'Password must not exceed 72 characters.'
        );
        return;
      }

      if (newPassword.value !== confirmPassword.value) {
        UI.showFieldError(
          confirmPassword,
          'Passwords do not match.'
        );
        return;
      }

      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;

      try {
        const response = await fetch('../api/resident-change-password.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            new_password: newPassword.value,
            confirm_password: confirmPassword.value
          })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          alertBox.textContent =
            result.error || result.message || 'Unable to update password.';
          alertBox.hidden = false;
          return;
        }

        alertBox.classList.remove('danger');
        alertBox.textContent = 'Password updated successfully! Redirecting...';
        alertBox.hidden = false;

        form.reset();

        setTimeout(() => {
          location.href = result.redirect || 'index.html';
        }, 1500);

      } catch (error) {
        alertBox.textContent =
          'Unable to connect to the server. Please try again.';
        alertBox.hidden = false;

      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
