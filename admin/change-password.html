<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password · ReportPoint Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="dashboard.html" aria-label="ReportPoint Admin Dashboard">
        <img class="brand-mark" src="../assets/logo-placeholder.png" alt="College Point">
        <span class="brand-divider"></span>
        <span class="brand-name">ReportPoint</span>
        <span class="admin-badge">ADMIN</span>
      </a>

      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav">☰</button>

      <div class="header-right">
        <nav class="nav" id="nav" aria-label="Admin">
          <a href="dashboard.html">Dashboard</a>
          <a href="reports.html">Reports</a>
          <a href="residents.html" data-perm="manage_residents">Residents</a>
          <a href="admins.html" data-perm="manage_admins">Admins</a>
          <div class="nav-user">
            <span id="nav-admin-name"></span>
            <button type="button" class="nav-link" id="logout-btn">Log Out</button>
          </div>
        </nav>
      </div>
    </div>
  </header>

  <main id="main" class="admin-main" style="max-width: 540px; margin: 2.5rem auto; padding: 0 1.25rem;">
    <div style="margin-bottom: 1.5rem;">
      <p class="eyebrow">Account Security</p>
      <h1 style="margin: 0.25rem 0 0.4rem;">Change Password</h1>
      <p id="admin-subtitle" style="opacity: 0.8; margin: 0;">Update your administrator password.</p>
    </div>

    <section class="card" style="padding: 1.75rem;">
      <form id="admin-change-pw-form" novalidate>
        <div class="form-group">
          <label for="currentPassword">Current password <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" id="currentPassword" autocomplete="current-password" required>
            <button type="button" class="password-toggle" data-target="currentPassword" aria-label="Show password"></button>
          </div>
          <p class="field-error" id="currentPassword-error"></p>
        </div>

        <div class="form-group">
          <label for="newPassword">New password <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
            <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show password"></button>
          </div>
          <p class="upload-hint" style="margin-top: 0.3rem;">Minimum 8 characters.</p>
          <p class="field-error" id="newPassword-error"></p>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm new password <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password"></button>
          </div>
          <p class="field-error" id="confirmPassword-error"></p>
        </div>

        <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
          <a class="btn" href="dashboard.html">Cancel</a>
          <button type="submit" class="btn btn-primary" id="save-pw-btn">Update Password</button>
        </div>
      </form>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const EYE_OPEN = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
      const EYE_OFF = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

      document.querySelectorAll('.password-toggle').forEach((btn) => {
        btn.innerHTML = EYE_OPEN;
        btn.addEventListener('click', () => {
          const input = document.getElementById(btn.dataset.target);
          if (!input) return;
          const showing = input.type === 'text';
          input.type = showing ? 'password' : 'text';
          btn.innerHTML = showing ? EYE_OPEN : EYE_OFF;
          btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        });
      });

      const admin = await UI.init({ page: 'change-password' });
      if (!admin) return;

      document.getElementById('admin-subtitle').textContent =
        `Signed in as ${admin.name} (${admin.username})`;

      const form = document.getElementById('admin-change-pw-form');
      const curInput = document.getElementById('currentPassword');
      const newInput = document.getElementById('newPassword');
      const confInput = document.getElementById('confirmPassword');
      const submitBtn = document.getElementById('save-pw-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        UI.showFieldError(curInput, '');
        UI.showFieldError(newInput, '');
        UI.showFieldError(confInput, '');

        let valid = true;
        if (!curInput.value) {
          UI.showFieldError(curInput, 'Please enter your current password.');
          valid = false;
        }
        if (newInput.value.length < 8) {
          UI.showFieldError(newInput, 'New password must be at least 8 characters.');
          valid = false;
        }
        if (confInput.value !== newInput.value) {
          UI.showFieldError(confInput, 'Passwords do not match.');
          valid = false;
        }
        if (!valid) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating...';

        try {
          const res = await fetch('../api/admin-change-password.php', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              current_password: curInput.value,
              new_password: newInput.value
            })
          });
          const data = await res.json();

          if (!res.ok || !data.ok) {
            UI.toast(data.error || 'Unable to update password.', 'error');
            return;
          }

          form.reset();
          document.querySelectorAll('.password-toggle').forEach((btn) => {
            const input = document.getElementById(btn.dataset.target);
            if (input) input.type = 'password';
            btn.innerHTML = EYE_OPEN;
            btn.setAttribute('aria-label', 'Show password');
          });
          UI.toast('Password updated successfully!');
        } catch (err) {
          UI.toast('Unable to connect to the server.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
        }
      });
    });
  </script>
</body>
</html>
