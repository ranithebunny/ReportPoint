
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password · ReportPoint</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/theme.css">

</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="login.html" aria-label="ReportPoint">
      <img class="brand-mark" src="../assets/logo-placeholder.png" alt="College Point">
      <span class="brand-divider"></span>
      <span class="brand-name">
        ReportPoint<span class="admin-badge">ADMIN</span>
      </span>
    </a>
  </div>
</header>

<main id="main">
  <div class="login-wrap">

    <p class="eyebrow">Account recovery</p>
    <h1>Forgot password?</h1>

    <p class="muted" style="margin:.75rem 0 1.5rem">
      Enter your registered email address and we'll send you a link to reset your password.
    </p>

    <div class="card">

      <div id="reset-alert" class="alert-box danger" role="alert" hidden></div>

      <form id="forgot-form" novalidate>

        <div class="field">
          <label for="email">
            Email address <span class="req">*</span>
          </label>

          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          >

          <div class="error-text" id="email-error"></div>
        </div>

        <button class="btn btn-primary btn-block" type="submit">
          Send reset link
        </button>

      </form>

      <p class="hint" style="margin-top:1.25rem">
        Remembered your password?
        <a href="login.html">Back to login</a>
      </p>

    </div>
  </div>
</main>

<footer class="site-footer">
  © 2026 ReportPoint · Group SoHo · Admin Console for College Point Manila
</footer>


<script>
const form = document.getElementById('forgot-form');
const emailInput = document.getElementById('email');
const alertBox = document.getElementById('reset-alert');

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    alertBox.hidden = true;

    const email = emailInput.value.trim();

    if (!email || !emailInput.checkValidity()) {
        alertBox.textContent = 'Please enter a valid email address.';
        alertBox.hidden = false;
        return;
    }

    const button = form.querySelector('button[type="submit"]');
    const originalText = button.textContent;

    button.disabled = true;
    button.textContent = 'Sending...';

    try {
        const response = await fetch('../api/forgot-password.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
            throw new Error(
                result.error || 'Unable to process your request.'
            );
        }

        alertBox.classList.remove('danger');
        alertBox.textContent =
            'If an account exists with that email, a password reset link will be sent.';
        alertBox.hidden = false;

        form.reset();

    } catch (error) {
        alertBox.classList.add('danger');
        alertBox.textContent =
            error.message || 'Unable to connect to the server.';
        alertBox.hidden = false;

    } finally {
        button.disabled = false;
        button.textContent = originalText;
    }
});
</script>
</body>
</html>

</body>
</html>
