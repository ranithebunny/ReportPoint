<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resident Details · ReportPoint Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <header class="site-header">
  <div class="header-inner">
    <a class="brand" href="dashboard.html" aria-label="ReportPoint admin home">
      <img class="brand-mark" src="../assets/logo-placeholder.png" alt="College Point">
      <span class="brand-divider"></span>
      <span class="brand-name">
        ReportPoint
        <span class="admin-badge">ADMIN</span>
      </span>
    </a>

    <button class="nav-toggle" aria-label="Toggle menu"
      aria-expanded="false" aria-controls="nav">☰</button>

    <nav class="nav" id="nav" aria-label="Admin">
      <a href="dashboard.html">Dashboard</a>
      <a href="reports.html">Reports</a>
      <a href="residents.html" data-perm="manage_residents">Residents</a>
      <a href="admins.html" data-perm="manage_admins">Admins</a>

      <span class="nav-user">
        <span id="nav-admin-name"></span>
        <button class="nav-link" id="logout-btn">Log out</button>
      </span>
    </nav>
  </div>
</header>
  <main id="main">
    <a class="back-link" href="residents.html">← Back to residents</a>
    <div id="loading-skeleton" aria-label="Loading resident details" aria-busy="true">
  <p class="eyebrow">Resident details</p>
  <div class="skeleton skeleton-resident-title"></div>

  <div class="grid grid-2" style="margin-top:2rem;align-items:start">

    <!-- Account skeleton -->
    <section class="card">
      <div class="skeleton skeleton-heading"></div>

      <div class="grid" style="grid-template-columns:150px 1fr;gap:0 1rem">
        <div class="skeleton skeleton-resident-line skeleton-resident-label"></div>
        <div class="skeleton skeleton-resident-line skeleton-resident-value"></div>

        <div class="skeleton skeleton-resident-line skeleton-resident-label"></div>
        <div class="skeleton skeleton-resident-line skeleton-resident-value"></div>

        <div class="skeleton skeleton-resident-line skeleton-resident-label"></div>
        <div class="skeleton skeleton-resident-line skeleton-resident-value"></div>

        <div class="skeleton skeleton-resident-line skeleton-resident-label"></div>
        <div class="skeleton skeleton-resident-line skeleton-resident-value"></div>

        <div class="skeleton skeleton-resident-line skeleton-resident-label"></div>
        <div class="skeleton skeleton-resident-line skeleton-resident-value"></div>

        <div class="skeleton skeleton-resident-line skeleton-resident-label"></div>
        <div class="skeleton skeleton-resident-line skeleton-resident-value"></div>

        <div class="skeleton skeleton-resident-line skeleton-resident-label"></div>
        <div class="skeleton skeleton-resident-line skeleton-resident-value"></div>
      </div>
    </section>

    <!-- Associated reports skeleton -->
    <section class="card">
      <div class="skeleton skeleton-heading"></div>

      <div class="skeleton skeleton-report"></div>
      <div class="skeleton skeleton-report"></div>
      <div class="skeleton skeleton-report"></div>
    </section>

  </div>
</div>
    <div id="root" hidden>
      <p class="eyebrow">Resident details</p>
      <h1 id="name"></h1>
      <div class="grid grid-2" style="margin-top:2rem;align-items:start">
        <section class="card" aria-labelledby="acct-h">
          <h2 id="acct-h">Account</h2>
          <dl class="kv" style="grid-template-columns:150px 1fr" id="acct"></dl>
          <p class="hint" style="margin-top:1rem">Passwords and other sign-in data are never shown on this page.</p>
        </section>
        <section class="card" aria-labelledby="rep-h">
          <h2 id="rep-h">Associated reports</h2>
          <div id="reports"></div>
        </section>
      </div>
    </div>
    <div id="not-found" class="card" hidden>
      <div class="empty"><strong>Resident not found</strong>The account may have been removed, or the link is incorrect.</div>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
 <script src="js/resident-details.js"></script>


</body>
</html>
