<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login · ReportPoint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/theme.css"> 
</head>
<body>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="login.html" aria-label="ReportPoint">
      <img class="brand-mark" src="../assets/logo-placeholder.png" alt="College Point">
      <span class="brand-divider"></span><span class="brand-name">ReportPoint<span class="admin-badge">ADMIN</span></span></a>
  </div></header>

  <main id="main">
    <div class="login-wrap">
      <p class="eyebrow">Staff sign in</p>
      <h1>Admin login</h1>
      <p class="muted" style="margin:.75rem 0 1.5rem">Sign in to review and manage resident reports.</p>

      <div class="card">
        <!-- Residents and admins share one login page on the live site; this tab switch is a placeholder
             until the shared login is built. The resident tab will link to ../resident/login.html. -->
        <div class="role-switch" role="tablist" aria-label="Account type">
          <a href="../resident/login.html">Resident</a>
          <a href="login.html" aria-current="true">Admin</a>
        </div>

        <form id="login-form" novalidate>
          <div id="login-alert" class="alert-box danger" role="alert" hidden></div>
          <div class="field">
            <label for="username">Username <span class="req" aria-hidden="true">*</span></label>
            <input type="text" id="username" name="username" autocomplete="username" required  aria-describedby="username-error">
            <div class="error-text" id="username-error"></div>
          </div>
          <div class="field">
  <label for="password">
    Password <span class="req" aria-hidden="true">*</span>
  </label>

  <div class="password-wrapper">
    <input
      type="password"
      id="password"
      name="password"
      autocomplete="current-password"
      required
      aria-describedby="password-error"
    >

    <button
      type="button"
      class="password-toggle"
      id="toggle-password"
      aria-label="Show password"
      aria-pressed="false"
    >
      <svg xmlns="http://www.w3.org/2000/svg"
        width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>

  <div class="error-text" id="password-error"></div>
</div>
          <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>
        <p class="hint" style="margin-top:1.25rem">
          Forgot your password? <a href="forgot-password.html" id="forgot-password-link">Reset your password</a> via your registered email address.<br>
        </p>
      </div>
    </div>
  </main>
  <footer class="site-footer">© 2026 ReportPoint · Group SoHo · Admin Console for College Point Manila · <strong>Authorized staff only</strong></footer>

  
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="../js/password-toggle.js"></script>
<script src="../js/login-validation.js"></script>
</body>
</html>
