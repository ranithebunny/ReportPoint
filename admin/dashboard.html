<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · ReportPoint Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="icon" type="image/png" href="../assets/favicon-rp.jpeg">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin navigation">
      <div class="sidebar-top">
        <a class="brand" href="dashboard.html" aria-label="ReportPoint Admin home">
          <img class="brand-mark" src="../assets/logo-placeholder.png" alt="College Point">
          <span class="brand-divider"></span>
          <span class="brand-name">
            ReportPoint
            <span class="admin-badge">ADMIN</span>
          </span>
        </a>
        <button type="button" class="sidebar-close" id="sidebar-close" aria-label="Close navigation">✕</button>
      </div>

      <nav class="sidebar-nav" aria-label="Primary admin sections">
        <div class="nav-group">
          <span class="nav-group-label">Overview</span>
          <a class="nav-item" href="dashboard.html" aria-current="page">
            <span>Dashboard</span>
          </a>
        </div>

        <div class="nav-group">
          <span class="nav-group-label">Issue Management</span>
          <a class="nav-item" href="reports.html">
            <span>Reports</span>
          </a>
        </div>

        <div class="nav-group">
          <span class="nav-group-label">Directory</span>
          <a class="nav-item" href="residents.html" data-perm="manage_residents">
            <span>Residents</span>
          </a>
          <a class="nav-item" href="admins.html" data-perm="manage_admins">
            <span>Admins</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-admin-info">
          <strong id="nav-admin-name"></strong>
        </div>
        <button type="button" class="btn btn-sm btn-block" id="logout-btn">Log out</button>
      </div>
    </aside>

    <div class="admin-backdrop" id="admin-backdrop" hidden></div>

    <div class="admin-main">
      <header class="admin-mobile-bar">
        <button type="button" class="nav-toggle" id="sidebar-open" aria-label="Open navigation" aria-expanded="false" aria-controls="admin-sidebar">☰</button>
        <span class="brand-name">ReportPoint <span class="admin-badge">ADMIN</span></span>
      </header>

      <main id="main">
        <div class="page-head">
          <div>
            <p class="eyebrow">Overview</p>
            <h1>Welcome back, <span id="who">Admin.</span></h1>
            <p>Summary of resident reports and recent activity.</p>
          </div>
          <a class="btn btn-primary btn-sm" href="reports.html">View all reports</a>
        </div>

        <div class="stack">
          <section class="grid grid-stats" id="stats" aria-label="Report statistics"></section>

          <div class="grid grid-2">
            <section class="card">
              <div class="card-title">
                <h2>Needs attention</h2>
                <a class="small" href="reports.html?status=Received">View new</a>
              </div>
              <div id="attention"></div>
            </section>

            <section class="card">
              <div class="card-title">
                <h2>Recent activity</h2>
                <a class="small" href="reports.html">All reports</a>
              </div>
              <div id="recent"></div>
            </section>
          </div>

          <div class="grid grid-2">
            <section class="card">
              <h2>By category</h2>
              <div id="categories"></div>
            </section>

            <section class="card">
              <h2>By priority</h2>
              <div id="priorities"></div>
            </section>
          </div>
        </div>
      </main>

      <div id="app-footer"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/admin-sidebar.js"></script>
  <script src="js/page-dashboard.js"></script>
</body>
</html>
