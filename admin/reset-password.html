
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password · ReportPoint</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="login.html" aria-label="ReportPoint">
      <img class="brand-mark" src="../assets/logo-placeholder.png" alt="College Point">
      <span class="brand-divider"></span>
      <span class="brand-name">
        ReportPoint<span class="admin-badge">ADMIN</span>
      </span>
    </a>
  </div>
</header>

<main id="main">
  <div class="login-wrap">

    <p class="eyebrow">Account recovery</p>
    <h1>Reset password</h1>

    <p class="muted" style="margin:.75rem 0 1.5rem">
      Create a new password for your administrator account.
    </p>

    <div class="card">

      <div id="reset-alert" class="alert-box danger" role="alert" hidden></div>

      <form id="reset-form" novalidate>

        <div class="field">
          <label for="password">
            New password <span class="req">*</span>
          </label>

          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="field">
          <label for="confirm-password">
            Confirm new password <span class="req">*</span>
          </label>

          <input
            type="password"
            id="confirm-password"
            name="confirm_password"
            autocomplete="new-password"
            required
          >
        </div>

        <button class="btn btn-primary btn-block" type="submit">
          Update password
        </button>

      </form>

      <p class="hint" style="margin-top:1.25rem">
        <a href="login.html">Back to login</a>
      </p>

    </div>
  </div>
</main>

<footer class="site-footer">
  © 2026 ReportPoint · Group SoHo · Admin Console for College Point Manila
</footer>

<script>
const form = document.getElementById('reset-form');
const passwordInput = document.getElementById('password');
const confirmInput = document.getElementById('confirm-password');
const alertBox = document.getElementById('reset-alert');

const params = new URLSearchParams(window.location.search);
const token = params.get('token');

if (!token) {
    alertBox.textContent = 'Invalid reset link. Please request a new one.';
    alertBox.hidden = false;
    form.querySelector('button[type="submit"]').disabled = true;
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    alertBox.hidden = true;

    const password = passwordInput.value;
    const confirmPassword = confirmInput.value;

    if (!token) {
        alertBox.textContent = 'Invalid reset link. Please request a new one.';
        alertBox.hidden = false;
        return;
    }

    if (password.length < 12) {
        alertBox.textContent = 'Your password must be at least 12 characters long.';
        alertBox.hidden = false;
        return;
    }

    if (password.length > 72) {
        alertBox.textContent = 'Your password must not exceed 72 characters.';
        alertBox.hidden = false;
        return;
    }

    if (password !== confirmPassword) {
        alertBox.textContent = 'Your passwords do not match.';
        alertBox.hidden = false;
        return;
    }

    const button = form.querySelector('button[type="submit"]');
    const originalText = button.textContent;

    button.disabled = true;
    button.textContent = 'Updating...';

    try {
        const response = await fetch('../api/reset-password.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ token, password })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
            throw new Error(result.message || 'Unable to update your password.');
        }

        alertBox.classList.remove('danger');
        alertBox.textContent = 'Password updated successfully! Redirecting to login...';
        alertBox.hidden = false;

        form.reset();

        setTimeout(() => {
            window.location.href = 'login.html';
        }, 2000);

    } catch (error) {
        alertBox.classList.add('danger');
        alertBox.textContent = error.message || 'Unable to connect to the server.';
        alertBox.hidden = false;

        button.disabled = false;
        button.textContent = originalText;
    }
});
</script>
</body>
</html>

</body>
</html>
